conky.config = {
    -- Mutter implements no layer-shell protocol, so conky's native Wayland output
    -- cannot run under GNOME and the widget lives on XWayland instead. A desktop-type
    -- window stays glued to the wallpaper layer: below every window, on all
    -- workspaces, hidden by "show desktop" like the desktop icons are.
    out_to_x = true,
    out_to_wayland = false,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,

    -- Fully transparent window; the visible panel is painted by the lua hook below,
    -- which is the only way conky gets rounded corners.
    own_window_argb_visual = true,
    own_window_argb_value = 0,

    double_buffer = true,

    lua_load = '@panelLua@',
    lua_draw_hook_pre = 'draw_panel',

    -- Sits on the right edge of the main monitor, vertically centred. Alignment is
    -- relative to a xinerama head, not the whole X screen, and XWayland lists the
    -- primary monitor first - so the default head is the ultrawide and the gap is a
    -- small margin from its own edge.
    alignment = 'middle_right',
    gap_x = 32,
    gap_y = 0,

    minimum_width = 380,
    maximum_width = 380,
    border_inner_margin = 20,

    update_interval = 1,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    no_buffers = true,

    use_xft = true,
    font = 'Adwaita Sans:size=12',
    xftalpha = 1,
    override_utf8_locale = true,

    default_color = 'e8e8e8',
    color1 = '5EB6F7',
    color2 = 'a0a0a0',

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    show_graph_scale = false,
    show_graph_range = false,

    top_name_width = 18,
}

conky.text = [[
${font Adwaita Sans:size=42}${alignc}${time %H:%M:%S}${font}
${alignc}${color2}${time %A, %d. %B %Y}${color}
${voffset 4}${color1}${font Adwaita Sans:bold:size=12}CPU${font}${color}  ${color2}Ryzen 9 7950X${color}${alignr}${hwmon k10temp temp 1}°C
${cpubar cpu0 6,}
${color2}Load${color} ${cpu cpu0}%${alignr}${color2}Freq${color} ${freq_g} GHz
${cpugraph cpu0 36,380 5EB6F7 5EB6F7}
${color2}${top name 1}${color}${alignr}${top cpu 1}%
${color2}${top name 2}${color}${alignr}${top cpu 2}%
${color2}${top name 3}${color}${alignr}${top cpu 3}%
${voffset 4}${color1}${font Adwaita Sans:bold:size=12}GPU${font}${color}  ${color2}RX 7900 XTX${color}${alignr}${execi 2 awk '{printf "%d", $1/1000}' @dgpu@/hwmon/hwmon*/temp2_input}°C
${color2}Busy${color} ${execi 2 cat @dgpu@/gpu_busy_percent}%${alignr}${color2}VRAM${color} ${execi 4 awk '{printf "%.1f", $1/1073741824}' @dgpu@/mem_info_vram_used} GiB
${voffset 4}${color1}${font Adwaita Sans:bold:size=12}Memory${font}${color}${alignr}$mem / $memmax
${membar 6,}
${voffset 4}${color1}${font Adwaita Sans:bold:size=12}Network${font}${color}  ${color2}enp10s0${color}
${color2}Down${color} ${downspeedf enp10s0} KiB/s${alignr}${color2}Up${color} ${upspeedf enp10s0} KiB/s
${downspeedgraph enp10s0 36,185 5EB6F7 5EB6F7}${alignr}${upspeedgraph enp10s0 36,185 5EB6F7 5EB6F7}
${voffset 4}${color1}${font Adwaita Sans:bold:size=12}Disks${font}${color}
${color2}System${color}${goto 135}${fs_bar 6,165 /}${alignr}${fs_used_perc /}%
${color2}Development${color}${goto 135}${fs_bar 6,165 /home/noah/Development}${alignr}${fs_used_perc /home/noah/Development}%
${color2}XOS${color}${goto 135}${fs_bar 6,165 /home/noah/XOS}${alignr}${fs_used_perc /home/noah/XOS}%
${color2}Stuff${color}${goto 135}${fs_bar 6,165 /home/noah/Stuff}${alignr}${fs_used_perc /home/noah/Stuff}%
${color2}Stuff2${color}${goto 135}${fs_bar 6,165 /home/noah/Stuff2}${alignr}${fs_used_perc /home/noah/Stuff2}%
${color2}Steam${color}${goto 135}${fs_bar 6,165 /home/noah/SteamLibrary}${alignr}${fs_used_perc /home/noah/SteamLibrary}%
${color2}CCache${color}${goto 135}${fs_bar 6,165 /home/noah/CCache}${alignr}${fs_used_perc /home/noah/CCache}%
${color2}4TB NVMe${color}${goto 135}${fs_bar 6,165 /home/noah/4TB-nvme}${alignr}${fs_used_perc /home/noah/4TB-nvme}%
${voffset 4}${color1}${font Adwaita Sans:bold:size=12}Media${font}${color}
${execi 2 @mediaStatus@}]]
